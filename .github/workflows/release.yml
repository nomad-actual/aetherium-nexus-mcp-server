name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Run only when a PR is merged into main. The push event is intentionally
    # not used: for squash/rebase merges the head commit message is not a
    # merge commit, so a push-based guard cannot reliably dedupe, and the
    # PR + push jobs raced to create duplicate releases.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Determine version bump
        id: version
        env:
          BRANCH: ${{ github.event.pull_request.head_ref }}
        run: |
          # Bump from the branch name (major/, fix/, hotfix/, else minor).
          SOURCE="$BRANCH"
          BUMP=""
          case "$SOURCE" in
            major/*) BUMP=major ;;
            fix/*|hotfix/*) BUMP=patch ;;
          esac
          if [ -z "$BUMP" ]; then
            BUMP=minor
          fi
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "Bump: $BUMP (source: $SOURCE)"

      - name: Create release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUMP="${{ steps.version.outputs.bump }}"
          LATEST=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)
          if [ -z "$LATEST" ]; then
            VERSION="0.1.0"
          else
            CURRENT=${LATEST#v}
            IFS=. read -r MAJOR MINOR PATCH <<< "$CURRENT"
            case "$BUMP" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              *)     PATCH=$((PATCH + 1)) ;;
            esac
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "Tag v${VERSION} already exists, skipping release"
            exit 0
          fi
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes

  docker:
    needs: release
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:v${{ needs.release.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          build-args: |
            VERSION=v${{ needs.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
