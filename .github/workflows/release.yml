name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.pull_request.merged == true &&
      !startsWith(github.head_ref, 'chore/') &&
      !startsWith(github.event.pull_request.title, 'chore:')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Determine version bump
        id: version
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BRANCH: ${{ github.event.pull_request.head_ref }}
        run: |
          # 1. Branch prefix (e.g. "fix/...")
          # 2. PR title prefix (conventional-commit style, e.g. "fix: ...")
          # 3. Fall through to minor
          BUMP=""
          case "$BRANCH" in
            major/*) BUMP=major ;;
            fix/*|hotfix/*) BUMP=patch ;;
          esac
          if [ -z "$BUMP" ]; then
            case "$TITLE" in
              major:*) BUMP=major ;;
              fix:*|hotfix:*) BUMP=patch ;;
              *:*) BUMP=minor ;;
            esac
          fi
          if [ -z "$BUMP" ]; then
            BUMP=minor
          fi
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "Bump: $BUMP (title: $TITLE, branch: $BRANCH)"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUMP="${{ steps.version.outputs.bump }}"
          LATEST=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)
          if [ -z "$LATEST" ]; then
            VERSION="0.1.0"
          else
            CURRENT=${LATEST#v}
            IFS=. read -r MAJOR MINOR PATCH <<< "$CURRENT"
            case "$BUMP" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              *)     PATCH=$((PATCH + 1)) ;;
            esac
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "Tag v${VERSION} already exists, skipping"
            exit 0
          fi
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes
