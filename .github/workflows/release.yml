name: Release

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # PR: run only when merged. Push: skip PR merge commits — the PR event
    # already handled versioning for them.
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'Merge pull request'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Determine version bump
        id: version
        env:
          BRANCH: ${{ github.event.pull_request.head_ref }}
          COMMIT: ${{ github.event.head_commit.message }}
        run: |
          # PR merges: bump from the branch name (major/, fix/, hotfix/, else minor).
          # Direct pushes: bump from the pushed commit's subject line
          # (major:, fix:, hotfix:, else minor).
          SOURCE="$BRANCH"
          if [ -z "$SOURCE" ]; then
            SOURCE="$(printf '%s' "$COMMIT" | head -n 1)"
          fi
          BUMP=""
          case "$SOURCE" in
            major/*|major:*) BUMP=major ;;
            fix/*|hotfix/*|fix:*|hotfix:*) BUMP=patch ;;
          esac
          if [ -z "$BUMP" ]; then
            BUMP=minor
          fi
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "Bump: $BUMP (source: $SOURCE)"

      - name: Create release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUMP="${{ steps.version.outputs.bump }}"
          LATEST=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)
          if [ -z "$LATEST" ]; then
            VERSION="0.1.0"
          else
            CURRENT=${LATEST#v}
            IFS=. read -r MAJOR MINOR PATCH <<< "$CURRENT"
            case "$BUMP" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              *)     PATCH=$((PATCH + 1)) ;;
            esac
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "Tag v${VERSION} already exists, skipping release"
            exit 0
          fi
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes

  docker:
    needs: release
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ghcr.io
        uses: docker/login-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:v${{ needs.release.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          build-args: |
            VERSION=v${{ needs.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
