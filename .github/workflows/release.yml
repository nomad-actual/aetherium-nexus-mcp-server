name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%B)
          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          if git rev-parse -q --verify "refs/tags/${SHORT_SHA}" >/dev/null; then
            echo "Tag ${SHORT_SHA} already exists, skipping"
            exit 0
          fi
          NOTES=$(printf '## %s\n\n%s\n\nCommit: %s' "${SHORT_SHA}" "${COMMIT_MSG}" "${COMMIT_URL}")
          gh release create "${SHORT_SHA}" \
            --title "${SHORT_SHA}" \
            --notes "${NOTES}"
