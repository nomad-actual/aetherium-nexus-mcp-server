version: 2
updates:
  # Production + dev dependencies (package.json / package-lock.json)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Bundle minor/patch updates into one PR; major updates arrive
      # individually so they get their own review.
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/.github/workflows"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
