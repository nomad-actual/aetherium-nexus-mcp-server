services:
  mcp-server:
    image: ghcr.io/nomad-actual/aetherium-nexus-mcp-server:latest
    container_name: aetherium-nexus-mcp
    env_file:
      - .env
    # Note: MCP_SERVER_HOST is intentionally NOT overridden here — compose
    # `environment:` entries silently take precedence over env_file, which
    # would pin the bind address and defeat the .env setting. The .env
    # value applies: default `localhost` binds the container's loopback
    # (safe, unreachable from outside); set MCP_SERVER_HOST=0.0.0.0 AND
    # MCP_SERVER_AUTH_TOKEN in .env for network access (see .env.example).
    ports:
      # Published on all host interfaces. Whether it is reachable depends
      # on MCP_SERVER_HOST in .env (loopback bind = unreachable from
      # outside, see note above).
      - "3030:3000"
    restart: unless-stopped
